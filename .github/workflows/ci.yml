name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests (PostgreSQL service)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        # Throwaway credentials for an ephemeral CI container only; not used anywhere else.
        env:
          POSTGRES_USER: gedp_app
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: gedp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gedp_app -d gedp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # DATABASE_URL must be valid and differ from the test database; CI never connects to it.
      DATABASE_URL: postgresql+psycopg://gedp_app:ci_only_password@localhost:5432/gedp_ci_unused
      TEST_DATABASE_URL: postgresql+psycopg://gedp_app:ci_only_password@localhost:5432/gedp_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Apply migrations to the test database
        run: alembic -x db=test upgrade head
      - name: Check models match migrations
        run: alembic -x db=test check
      - name: Run tests (World Bank API is always mocked)
        run: pytest -v --cov=src --cov-report=term-missing
